            <text x="46" y="0" class="font semibold" font-size="10.5" fill="#ff453a">AO VIVO</text>
            <text x="0" y="24" class="font semibold" font-size="14" fill="rgba(255,255,255,0.9)">Esportes Radicais HD</text>
