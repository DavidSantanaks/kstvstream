        <!-- Channel 4 -->
        <g transform="translate(0, 92)">
          <rect width="292" height="74" rx="14" fill="#14141a" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
          <rect x="12" y="13" width="48" height="48" rx="10" fill="#0b0b0e" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
