        <text x="16" y="218" class="font medium" font-size="14" fill="rgba(235,235,245,0.7)">Notícias 24h</text>
        <text x="214" y="218" text-anchor="end" class="font regular" font-size="12" fill="rgba(235,235,245,0.4)">45</text>

