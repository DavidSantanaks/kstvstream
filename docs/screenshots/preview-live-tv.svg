          <rect x="12" y="13" width="48" height="48" rx="10" fill="#0b0b0e" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
          <text x="36" y="42" text-anchor="middle" class="font title" font-size="12" fill="#ffffff">LUT</text>
          <g transform="translate(72, 26)">
            <text x="0" y="0" class="font semibold" font-size="11" fill="rgba(235,235,245,0.5)">CH 5</text>
            <circle cx="38" cy="-4" r="3" fill="#ff453a"/>
            <text x="46" y="0" class="font semibold" font-size="10.5" fill="#ff453a">AO VIVO</text>
            <text x="0" y="24" class="font semibold" font-size="14" fill="rgba(255,255,255,0.9)">Combate &amp; Luta FHD</text>
