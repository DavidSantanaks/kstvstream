        <text x="128" y="19" text-anchor="middle" class="font semibold" font-size="11" fill="rgba(235,235,245,0.85)">18</text>
      </g>

      <!-- Category Items List -->
      <g transform="translate(0, 38)">
        <!-- Item 1: Todos os Canais -->
        <rect x="0" y="0" width="230" height="42" rx="11" fill="transparent"/>
        <text x="16" y="26" class="font medium" font-size="14" fill="rgba(235,235,245,0.7)">Todos os Canais</text>
        <text x="214" y="26" text-anchor="end" class="font regular" font-size="12" fill="rgba(235,235,245,0.4)">1240</text>

        <!-- Item 2: ACTIVE (Esportes 4K) -->
        <rect x="0" y="48" width="230" height="42" rx="11" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
        <circle cx="20" cy="69" r="3.5" fill="#64d2ff"/>
        <text x="32" y="74" class="font semibold" font-size="14" fill="#ffffff">Esportes 4K &amp; UHD</text>
        <text x="214" y="74" text-anchor="end" class="font semibold" font-size="12" fill="#64d2ff">34</text>

        <!-- Item 3 -->
        <rect x="0" y="96" width="230" height="42" rx="11" fill="transparent"/>
        <text x="16" y="122" class="font medium" font-size="14" fill="rgba(235,235,245,0.7)">Variedades &amp; Aberta</text>
        <text x="214" y="122" text-anchor="end" class="font regular" font-size="12" fill="rgba(235,235,245,0.4)">62</text>

        <!-- Item 4 -->
        <rect x="0" y="144" width="230" height="42" rx="11" fill="transparent"/>
        <text x="16" y="170" class="font medium" font-size="14" fill="rgba(235,235,245,0.7)">Filmes &amp; Séries 24h</text>
        <text x="214" y="170" text-anchor="end" class="font regular" font-size="12" fill="rgba(235,235,245,0.4)">118</text>

