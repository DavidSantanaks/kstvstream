<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <!-- Cinematic Video Frame Gradient (Simulated 4K Stream) -->
    <linearGradient id="video-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1220"/>
      <stop offset="50%" stop-color="#141a2e"/>
      <stop offset="100%" stop-color="#080b14"/>
    </linearGradient>

    <!-- Top & Bottom OSD Vignette -->
    <linearGradient id="osd-top-vignette" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.88"/>
      <stop offset="65%" stop-color="#000000" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="osd-bottom-vignette" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.94"/>
      <stop offset="65%" stop-color="#000000" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="badge-4k-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d4d4e0"/>
    </linearGradient>

    <filter id="shadow-deep" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.75"/>
    </filter>

    <filter id="pill-shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .font { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif; }
    .title { font-weight: 700; letter-spacing: -0.03em; }
    .semibold { font-weight: 600; letter-spacing: -0.01em; }
    .medium { font-weight: 500; }
    .regular { font-weight: 400; }
  </style>

  <!-- Video Background Canvas -->
  <rect width="1280" height="720" fill="url(#video-bg)"/>

  <!-- Simulated Cinematic Artwork Elements in Video Stream -->
  <g opacity="0.6">
    <ellipse cx="640" cy="380" rx="420" ry="240" fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.4"/>
    <ellipse cx="640" cy="380" rx="320" ry="180" fill="none" stroke="#60a5fa" stroke-width="1" opacity="0.3"/>
    <circle cx="640" cy="380" r="120" fill="#1e3a8a" opacity="0.4"/>
    <circle cx="640" cy="380" r="40" fill="#93c5fd" opacity="0.7"/>
    <!-- Subtle Star Points -->
    <circle cx="320" cy="220" r="2" fill="#ffffff" opacity="0.8"/>
    <circle cx="940" cy="180" r="2.5" fill="#ffffff" opacity="0.7"/>
    <circle cx="210" cy="460" r="1.5" fill="#ffffff" opacity="0.6"/>
    <circle cx="820" cy="480" r="2" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Top Vignette -->
  <rect width="1280" height="180" fill="url(#osd-top-vignette)"/>

  <!-- Bottom Vignette -->
  <rect y="440" width="1280" height="280" fill="url(#osd-bottom-vignette)"/>

  <!-- ================= TOP OSD BAR ================= -->
  <g transform="translate(48, 28)">
    <!-- Back Button (‹ Voltar) -->
    <g filter="url(#pill-shadow)">
      <rect x="0" y="0" width="108" height="40" rx="20" fill="rgba(255,255,255,0.14)" stroke="rgba(255,255,255,0.22)" stroke-width="1"/>
      <path d="M22 20 L30 13 M22 20 L30 27" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="38" y="25" class="font semibold" font-size="14" fill="#ffffff">Voltar</text>
    </g>

    <!-- Badges in Top Bar -->
    <g transform="translate(124, 6)">
      <!-- AO VIVO Badge -->
      <rect x="0" y="0" width="76" height="28" rx="14" fill="#ff453a"/>
      <circle cx="16" cy="14" r="3.5" fill="#ffffff"/>
      <text x="44" y="19" text-anchor="middle" class="font semibold" font-size="11.5" fill="#ffffff">AO VIVO</text>

      <!-- Category Pill -->
      <rect x="86" y="0" width="92" height="28" rx="14" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
      <text x="132" y="19" text-anchor="middle" class="font semibold" font-size="12" fill="#ffffff">TV ao Vivo</text>

      <!-- 4K UHD Glowing Badge -->
      <rect x="188" y="0" width="70" height="28" rx="14" fill="url(#badge-4k-grad)" filter="url(#pill-shadow)"/>
      <text x="223" y="19" text-anchor="middle" class="font title" font-size="11" fill="#000000">4K UHD</text>
    </g>
  </g>

  <!-- ================= APPLE TV+ TRACKS POPOVER (Resolução / Áudio / Legendas) ================= -->
  <g transform="translate(480, 240)" filter="url(#shadow-deep)">
    <!-- Glass Sheet -->
    <rect width="320" height="280" rx="20" fill="#14141c" stroke="rgba(255,255,255,0.22)" stroke-width="1"/>
    
    <!-- Header -->
    <g transform="translate(20, 26)">
      <text x="0" y="0" class="font title" font-size="16" fill="#ffffff">Qualidade de Vídeo</text>
      <!-- Close Button -->
      <g transform="translate(254, -14)">
        <circle cx="13" cy="13" r="13" fill="rgba(255,255,255,0.12)"/>
        <path d="M9 9 L17 17 M17 9 L9 17" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
      </g>
    </g>

    <line x1="20" y1="46" x2="300" y2="46" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

    <!-- Track Items List -->
    <g transform="translate(16, 56)">
      <!-- Item 1: Automática -->
      <rect x="0" y="0" width="288" height="44" rx="10" fill="transparent"/>
      <text x="36" y="22" class="font medium" font-size="13.5" fill="rgba(235,235,245,0.8)">Automática</text>
      <text x="36" y="36" class="font regular" font-size="10.5" fill="rgba(235,235,245,0.45)">Ajusta à velocidade da conexão</text>

      <!-- Item 2: 4K UHD (2160p) - ACTIVE CHECKED -->
      <rect x="0" y="48" width="288" height="46" rx="10" fill="rgba(255,255,255,0.14)" stroke="rgba(255,255,255,0.22)" stroke-width="1"/>
      <!-- Checkmark -->
      <path d="M14 71 L20 77 L30 65" fill="none" stroke="#64d2ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="38" y="70" class="font semibold" font-size="14" fill="#ffffff">4K UHD (2160p)</text>
      <text x="38" y="85" class="font regular" font-size="10.5" fill="#64d2ff">3840x2160 • 18.5 Mbps (H.265)</text>

      <!-- Item 3: Full HD (1080p) -->
      <rect x="0" y="98" width="288" height="44" rx="10" fill="transparent"/>
      <text x="38" y="120" class="font medium" font-size="13.5" fill="rgba(235,235,245,0.8)">Full HD (1080p)</text>
      <text x="38" y="134" class="font regular" font-size="10.5" fill="rgba(235,235,245,0.45)">1920x1080 • 8.2 Mbps</text>

      <!-- Item 4: HD (720p) -->
      <rect x="0" y="146" width="288" height="44" rx="10" fill="transparent"/>
      <text x="38" y="168" class="font medium" font-size="13.5" fill="rgba(235,235,245,0.8)">HD (720p)</text>
      <text x="38" y="182" class="font regular" font-size="10.5" fill="rgba(235,235,245,0.45)">1280x720 • 4.5 Mbps</text>
    </g>
  </g>

  <!-- ================= FLOATING PICTURE-IN-PICTURE (MINI PLAYER) ================= -->
  <!-- Positioned in bottom right, showing direct 1-click Close & Expand -->
  <g transform="translate(900, 390)" filter="url(#shadow-deep)">
    <!-- Window Border & Body -->
    <rect width="332" height="196" rx="18" fill="#0d111a" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
    
    <!-- Mini Stream Graphics -->
    <g opacity="0.7">
      <ellipse cx="166" cy="110" rx="110" ry="60" fill="none" stroke="#60a5fa" stroke-width="1" opacity="0.5"/>
      <circle cx="166" cy="110" r="30" fill="#3b82f6" opacity="0.4"/>
      <circle cx="166" cy="110" r="10" fill="#ffffff" opacity="0.9"/>
    </g>

    <!-- Mini PiP Top Action Bar (#mini-pip-bar) -->
    <g transform="translate(0, 0)">
      <rect width="332" height="38" rx="18" fill="rgba(0,0,0,0.72)"/>
      <!-- Clip lower corners -->
      <rect y="20" width="332" height="18" fill="rgba(0,0,0,0.72)"/>

      <!-- Title -->
      <circle cx="16" cy="19" r="3.5" fill="#ff453a"/>
      <text x="26" y="23" class="font semibold" font-size="11.5" fill="#ffffff">KS Esportes Brasil 4K</text>

      <!-- Expand Button -->
      <g transform="translate(254, 7)">
        <rect width="28" height="24" rx="7" fill="rgba(255,255,255,0.15)"/>
        <path d="M7 15 L7 17 L9 17 M21 9 L21 7 L19 7 M7 9 L7 7 L9 7 M21 15 L21 17 L19 17" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
      </g>

      <!-- Close (✕) Button (DIRECT 1-CLICK CLOSE) -->
      <g transform="translate(288, 7)">
        <rect width="28" height="24" rx="7" fill="rgba(255,69,58,0.25)" stroke="rgba(255,69,58,0.4)" stroke-width="1"/>
        <path d="M9 7 L19 17 M19 7 L9 17" fill="none" stroke="#ff453a" stroke-width="1.8" stroke-linecap="round"/>
      </g>
    </g>

    <text x="166" y="180" text-anchor="middle" class="font medium" font-size="11" fill="rgba(235,235,245,0.75)">Mini Player PiP com Fechamento Direto</text>
  </g>

  <!-- ================= BOTTOM PLAYER OSD BAR ================= -->
  <g transform="translate(48, 620)">
    <!-- OSD Main Controls Row -->
    <g transform="translate(0, 0)">
      <!-- Channel Info -->
      <g transform="translate(0, 0)">
        <text x="0" y="20" class="font title" font-size="22" fill="#ffffff">KS Esportes Brasil 4K</text>
        <text x="0" y="42" class="font medium" font-size="13" fill="rgba(235,235,245,0.7)">AGORA: Final do Campeonato 2026 • Ao Vivo em 4K 60 FPS</text>
      </g>

      <!-- Buttons Row -->
      <g transform="translate(480, 4)">
        <!-- Play/Pause Button -->
        <g>
          <rect x="0" y="0" width="112" height="42" rx="21" fill="#ffffff" filter="url(#pill-shadow)"/>
          <rect x="22" y="14" width="4" height="14" rx="1.5" fill="#000000"/>
          <rect x="30" y="14" width="4" height="14" rx="1.5" fill="#000000"/>
          <text x="68" y="26" text-anchor="middle" class="font semibold" font-size="13.5" fill="#000000">Pausar</text>
        </g>

        <!-- Resolução Button (Active with Popover) -->
        <g transform="translate(122, 0)">
          <rect x="0" y="0" width="138" height="42" rx="21" fill="rgba(255,255,255,0.22)" stroke="#ffffff" stroke-width="1.5"/>
          <circle cx="20" cy="21" r="7" fill="none" stroke="#ffffff" stroke-width="1.6"/>
          <text x="76" y="26" text-anchor="middle" class="font semibold" font-size="13" fill="#ffffff">Resolução</text>
        </g>

        <!-- Áudio Button -->
        <g transform="translate(268, 0)">
          <rect x="0" y="0" width="112" height="42" rx="21" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
          <path d="M18 17 L22 17 L27 12 L27 30 L22 25 L18 25 Z" fill="#ffffff"/>
          <text x="64" y="26" text-anchor="middle" class="font semibold" font-size="13" fill="#ffffff">Áudio</text>
        </g>

        <!-- Legendas Button -->
        <g transform="translate(388, 0)">
          <rect x="0" y="0" width="124" height="42" rx="21" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
          <rect x="16" y="13" width="18" height="14" rx="3" fill="none" stroke="#ffffff" stroke-width="1.6"/>
          <path d="M20 20 L30 20" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
          <text x="72" y="26" text-anchor="middle" class="font semibold" font-size="13" fill="#ffffff">Legendas</text>
        </g>

        <!-- Ocultar Menu Button -->
        <g transform="translate(520, 0)">
          <rect x="0" y="0" width="100" height="42" rx="21" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
          <text x="50" y="26" text-anchor="middle" class="font semibold" font-size="13" fill="#ffffff">Ocultar</text>
        </g>
      </g>
    </g>
  </g>
</svg>
