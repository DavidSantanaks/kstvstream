name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Fontes, testes e interface
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm run check
      - run: npm test
      - name: Validar workflows
        run: node scripts/lint-workflows.cjs
      - name: Testar interface
        run: npm run test:ui
        env:
          QA_BROWSER: /usr/bin/google-chrome
          QA_ARTIFACTS_DIR: .qa-results
      - name: Relatorio de interface
        if: always() && hashFiles('.qa-results/*.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: interface-qa
          path: |
            .qa-results/*.json
            .qa-results/*.png
          if-no-files-found: error
          retention-days: 7
  android:
    name: APK de teste e Android Lint
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: node scripts/prepare-android-sdk.cjs
      - run: node scripts/sync-web-assets.cjs
      - name: Compilar e verificar Android
        working-directory: android-firetv
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:lintDebug --no-daemon --console=plain --warning-mode=fail
      - name: Guardar APK de teste
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: KS-TV-Player-debug
          path: android-firetv/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
