name: Release assinada
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versao vMAJOR.MINOR.PATCH'
        required: true
        default: v1.0.0
      publish:
        description: 'Publicar GitHub Release depois da validacao'
        type: boolean
        default: false
      prerelease:
        description: 'Marcar como pre-release'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  signed-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Validar versao
        id: version
        run: node scripts/release-version.cjs
        env:
          KS_RELEASE_VERSION: ${{ inputs.version }}
      - run: npm run check && npm test
      - run: node scripts/lint-workflows.cjs
      - run: npm run test:ui
        env:
          QA_BROWSER: /usr/bin/google-chrome
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: node scripts/prepare-android-sdk.cjs
      - run: node scripts/sync-web-assets.cjs
      - name: Preparar assinatura privada
        run: |
          node -e 'const fs=require("node:fs"); const keys=["KS_SIGNING_KEYSTORE_BASE64","KS_SIGNING_STORE_PASSWORD","KS_SIGNING_KEY_ALIAS","KS_SIGNING_KEY_PASSWORD"]; if(keys.some(k=>!process.env[k])) throw new Error("Configure os quatro secrets KS_SIGNING_* antes de gerar release."); fs.writeFileSync(process.env.RUNNER_TEMP+"/ks-release.jks",Buffer.from(process.env.KS_SIGNING_KEYSTORE_BASE64,"base64"),{mode:0o600});'
        env:
          KS_SIGNING_KEYSTORE_BASE64: ${{ secrets.KS_SIGNING_KEYSTORE_BASE64 }}
          KS_SIGNING_STORE_PASSWORD: ${{ secrets.KS_SIGNING_STORE_PASSWORD }}
          KS_SIGNING_KEY_ALIAS: ${{ secrets.KS_SIGNING_KEY_ALIAS }}
          KS_SIGNING_KEY_PASSWORD: ${{ secrets.KS_SIGNING_KEY_PASSWORD }}
      - name: Compilar release assinada
        working-directory: android-firetv
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease :app:lintRelease --no-daemon --console=plain --warning-mode=fail -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          KS_SIGNING_STORE_FILE: ${{ runner.temp }}/ks-release.jks
          KS_SIGNING_STORE_PASSWORD: ${{ secrets.KS_SIGNING_STORE_PASSWORD }}
          KS_SIGNING_KEY_ALIAS: ${{ secrets.KS_SIGNING_KEY_ALIAS }}
          KS_SIGNING_KEY_PASSWORD: ${{ secrets.KS_SIGNING_KEY_PASSWORD }}
      - name: Preparar APK e checksums
        run: node scripts/package-release.cjs
        env:
          KS_RELEASE_VERSION: ${{ steps.version.outputs.tag }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: KS-TV-Player-${{ steps.version.outputs.tag }}
          path: |
            dist/*.apk
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 14
      - name: Publicar versao
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: KS TV Player ${{ steps.version.outputs.tag }}
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.apk
            dist/checksums.txt
      - name: Remover keystore temporario
        if: always()
        run: node -e 'require("node:fs").rmSync(process.env.RUNNER_TEMP+"/ks-release.jks",{force:true});'
